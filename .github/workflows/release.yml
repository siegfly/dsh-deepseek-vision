name: Publish GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_CHECKOUT: ${{ github.workspace }}/dsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness "$DSH_CHECKOUT"
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.DSH_CHECKOUT }}
      - run: pnpm run build
        working-directory: ${{ env.DSH_CHECKOUT }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: node scripts/check-compat.mjs
      - run: pnpm pack --pack-destination dist
      - run: sha256sum dist/*.tgz > dist/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
